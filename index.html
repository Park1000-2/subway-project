<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앉아서 가기</title>
<meta name="description" content="출퇴근 시각에 맞춰 가장 앉을 가능성이 큰 지하철 열차를 찾습니다">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d1620">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="앉아서 가기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ──────────────────────────────────────────────────────────────
   역 안내 사인의 어법으로. 색은 '지금 타는 노선의 색' 하나만 쓰고,
   나머지는 종이와 잉크. 모서리는 거의 직각 — 사인은 둥글지 않습니다.
   ────────────────────────────────────────────────────────────── */
:root{
  --paper:#f3f2ee; --sheet:#fbfaf7; --ink:#14161a; --ink-2:#55595f; --ink-3:#8b8f96;
  --rule:#dcd8d1; --rule-2:#e9e6e0; --board:#15171b; --board-ink:#edefF2; --board-2:#8b949f;
  --line:#2a78d6;                      /* 경로에 따라 JS가 바꿉니다 */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --grid:#c9c4bb;
  /* 차트 색 — 수치는 잉크 계열로 그리고, 강조(추천 열차·한산한 칸)만 노선색을 씁니다.
     노선색이 주황일 때 혼잡도 경고색과 부딪히지 않게 하려는 분리입니다. */
  --series:#39424d; --series-soft:#98a2ad; --bar:#aab2bb;
  --accent:var(--line); --accent-soft:color-mix(in srgb,var(--line) 14%,transparent);
  --surface:var(--sheet); --seq-450:var(--series); --seq-250:var(--series-soft);
  --bar-hi:var(--line); --rule-2:#e9e6e0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101114; --sheet:#17191d; --ink:#eceef1; --ink-2:#aeb3ba; --ink-3:#7d828a;
  --rule:#2b2e33; --rule-2:#212429; --board:#0a0b0d; --board-ink:#edeff2; --board-2:#868e99;
  --grid:#3a3e45;
  --series:#b4bfcb; --series-soft:#616c79; --bar:#515b67;
  --surface:var(--sheet); --seq-450:var(--series); --seq-250:var(--series-soft);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#101114; --sheet:#17191d; --ink:#eceef1; --ink-2:#aeb3ba; --ink-3:#7d828a;
  --rule:#2b2e33; --rule-2:#212429; --board:#0a0b0d; --board-ink:#edeff2; --board-2:#868e99;
  --grid:#3a3e45;
  --series:#b4bfcb; --series-soft:#616c79; --bar:#515b67;
  --surface:var(--sheet); --seq-450:var(--series); --seq-250:var(--series-soft);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.sign{font-family:"Black Han Sans","Gothic A1",sans-serif;font-weight:400;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding-inline:18px}
a{color:inherit}

/* ── 상단 안내판 ── */
.board{background:var(--board);color:var(--board-ink);
  padding-block:20px 18px;padding-top:calc(20px + env(safe-area-inset-top,0px));
  border-bottom:3px solid var(--line)}
.board .wrap{display:flex;flex-direction:column;gap:16px}
.brandrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.brandrow h1{margin:0;font-size:25px;line-height:1}
.brandrow .tagline{color:var(--board-2);font-size:12px;letter-spacing:.01em}
.controls{display:grid;gap:9px 11px;grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:10.5px;letter-spacing:.1em;color:var(--board-2);font-weight:700}
.field input,.field select{width:100%;background:#1f232a;border:1px solid #333942;color:#f1f4f7;
  border-radius:2px;padding:9px 10px;font:inherit;font-size:14px}
.field input:focus-visible,.field select:focus-visible,button:focus-visible{
  outline:2px solid var(--line);outline-offset:1px}
.controls .go{grid-column:span 4;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
button.primary{background:var(--line);color:#fff;border:0;border-radius:2px;padding:10px 22px;
  font-family:"Black Han Sans",sans-serif;font-size:14.5px;cursor:pointer;letter-spacing:.02em}
button.primary:hover{filter:brightness(1.12)}
.hint{color:var(--board-2);font-size:11.5px}
@media (max-width:780px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.controls .go{grid-column:span 2}}
@media (max-width:430px){.controls{grid-template-columns:1fr}.controls .go{grid-column:span 1}
  .brandrow .tagline{display:none}}

/* ── 즐겨찾기 ── */
.favs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  border-top:1px solid #272b31;padding-top:13px}
.favs-label{font-size:10.5px;letter-spacing:.1em;color:var(--board-2);font-weight:700;margin-right:3px}
.fav{display:inline-flex;align-items:stretch;border:1px solid #333942;border-radius:2px;background:#1f232a}
.fav.active{border-color:var(--line);background:#252a32}
.fav button{background:none;border:0;color:#dfe4ea;font:inherit;font-size:12px;cursor:pointer;padding:5px 3px 5px 10px}
.fav button em{font-style:normal;color:var(--board-2);margin-left:6px;
  font-family:"IBM Plex Mono",monospace;font-size:11px}
.fav .fav-x{padding:5px 9px 5px 6px;color:#697280;font-size:13px}
.fav .fav-x:hover{color:#ff9090}
.fav button:hover{color:#fff}
.fav-add{border:1px dashed #3d444e;border-radius:2px;background:none;color:var(--board-2);
  font:600 12px/1 "Noto Sans KR",sans-serif;padding:6px 11px;cursor:pointer}
.fav-add:hover:not(:disabled){border-color:var(--line);color:#e7ecf2}
.fav-add:disabled{opacity:.4;cursor:default}

/* ── 본문: 카드 대신 규칙선으로 나눕니다 ── */
main{padding-block:0 calc(44px + env(safe-area-inset-bottom,0px))}
section{padding-block:26px;border-top:1px solid var(--rule)}
section:first-child{border-top:0;padding-top:22px}
h2{margin:0 0 14px;font-family:"Black Han Sans",sans-serif;font-weight:400;
  font-size:15px;letter-spacing:.01em}
h2 .sub{font-family:"Noto Sans KR",sans-serif;font-weight:400;color:var(--ink-3);
  font-size:12px;margin-left:9px;letter-spacing:0}
.eyebrow{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}

/* ── 출발 사인: 이 화면에서 유일하게 큰 소리 ── */
.sign-band{background:var(--line);color:#fff;padding:18px 20px 16px;
  display:grid;grid-template-columns:auto 1fr;gap:4px 20px;align-items:end}
.sign-band .lead{grid-column:1;font-size:11px;letter-spacing:.14em;opacity:.82;font-weight:700}
.sign-band .clock{grid-column:1;font-family:"IBM Plex Mono",monospace;font-weight:600;
  font-size:clamp(46px,13vw,68px);line-height:.92;letter-spacing:-.035em}
.sign-band .where{grid-column:2;grid-row:2;padding-bottom:9px;font-size:14px;line-height:1.45}
.sign-band .where b{font-weight:700}
.sign-band .where span{opacity:.82}
.sign-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
  border:1px solid var(--rule);border-top:0;background:var(--sheet)}
.sign-rows>div{padding:11px 14px;border-left:1px solid var(--rule-2)}
.sign-rows>div:first-child{border-left:0}
.sign-rows .k{font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.sign-rows .v{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;line-height:1.25}
.sign-rows .v small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px;
  font-family:"Noto Sans KR",sans-serif}
.bar{height:4px;background:var(--rule-2);margin-top:7px}
.bar i{display:block;height:100%;background:var(--line)}

.callout{border-left:3px solid var(--line);background:var(--sheet);
  padding:11px 14px;font-size:13px;color:var(--ink-2);margin-top:12px}
.callout b{color:var(--ink)}
.callout.warn{border-left-color:var(--critical)}

/* ── 세로 노선도 ── */
.track{margin-top:4px}
.trk{display:grid;grid-template-columns:52px 26px 1fr;align-items:start}
.trk .time{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);
  text-align:right;padding-right:12px;padding-top:1px}
.trk .rail{position:relative;justify-self:center;width:26px;align-self:stretch}
.trk .rail::before{content:"";position:absolute;left:50%;transform:translateX(-50%);
  top:0;bottom:0;width:6px;background:var(--c,var(--line))}
.trk.stop .rail::before{top:9px}
.trk.stop.last .rail::before{bottom:auto;height:0}
.trk .dot{position:absolute;left:50%;top:3px;transform:translateX(-50%);
  width:14px;height:14px;border-radius:50%;background:var(--sheet);
  border:3.5px solid var(--c,var(--line));z-index:1}
.trk.stop .name{font-weight:700;font-size:15px;line-height:1.3;padding-bottom:12px}
.trk.stop .name small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);
  letter-spacing:.01em;margin-top:1px}
.trk.ride{padding-block:2px}
.trk.ride .body{padding:0 0 14px 2px;color:var(--ink-2);font-size:12.5px;line-height:1.65}
.trk.ride .body .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  color:var(--ink);font-size:13px;margin-bottom:2px}
.trk.xfer .body{padding:2px 0 14px 2px;font-size:12.5px;color:var(--ink-2)}
.trk.xfer .rail::before{background:repeating-linear-gradient(
  to bottom,var(--c,var(--line)) 0 6px,transparent 6px 12px)}
.badge{display:inline-flex;align-items:center;justify-content:center;color:#fff;
  font-family:"Black Han Sans",sans-serif;font-size:11.5px;line-height:1;
  min-width:22px;height:22px;border-radius:999px;padding:0 7px;letter-spacing:.02em}

/* ── 차트 ── */
svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;pointer-events:none;z-index:40;background:var(--board);color:#eef3f8;
  border-radius:2px;padding:8px 10px;font-size:12px;line-height:1.5;
  box-shadow:0 6px 20px -6px rgba(0,0,0,.55);opacity:0;transition:opacity .12s;max-width:230px}
.tip.on{opacity:1}
.tip .tt{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px}
.tip em{color:#9aa4b0;font-style:normal}

/* ── 표 ── */
.scroll{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:560px}
th,td{text-align:right;padding:7px 11px;border-bottom:1px solid var(--rule-2);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.07em;color:var(--ink-3);font-weight:700;
  border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--sheet)}
th:first-child,td:first-child{text-align:left}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--rule-2)}
tr.best td{background:color-mix(in srgb,var(--line) 13%,transparent);font-weight:600}
tr.out td{color:var(--ink-3)}
.tag{display:inline-block;font-size:10px;font-weight:700;border-radius:2px;padding:1px 5px;
  background:var(--line);color:#fff;margin-left:6px;vertical-align:1px}
.tag.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:2px;padding:3px 9px;
  font-size:11.5px;font-weight:700;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}

footer.sources{color:var(--ink-3);font-size:12px;line-height:1.75;
  border-top:1px solid var(--rule);padding-top:18px;margin-top:26px}
footer.sources h3{font-size:12px;color:var(--ink-2);margin:0 0 3px;font-weight:700}
footer.sources ul{margin:0 0 10px;padding-left:17px}
.empty{padding:34px 0;text-align:center;color:var(--ink-3)}
.card{background:none;border:0}   /* 더는 카드로 감싸지 않습니다 — 구획은 규칙선이 합니다 */
.card.pad{padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="brandrow">
      <h1 class="sign">앉아서 가기</h1>
      <p class="tagline">출퇴근 시각에 맞춰 가장 앉을 가능성이 큰 열차 · 수도권 전철</p>
    </div>
    <form class="controls" id="form">
      <div class="field"><label for="home" id="homeLabel">집 역</label>
        <input id="home" list="stations" autocomplete="off" value="서울역" spellcheck="false"></div>
      <div class="field"><label for="work" id="workLabel">회사 역</label>
        <input id="work" list="stations" autocomplete="off" value="강남" spellcheck="false"></div>
      <div class="field"><label for="trip">무슨 길</label>
        <select id="trip">
          <option value="to-work">출근 — 집 → 회사</option>
          <option value="to-home">퇴근 — 회사 → 집</option>
          <option value="free">다른 곳 — 직접 지정</option>
        </select></div>
      <div class="field" id="timeBasisField"><label for="timeBasis">시각 기준</label>
        <select id="timeBasis">
          <option value="depart">이 시각 이후 출발</option>
          <option value="arrive">이 시각까지 도착</option>
        </select></div>
      <div class="field"><label for="time" id="timeLabel">회사 도착 시각</label>
        <input id="time" type="time" class="mono" value="09:00" step="300"></div>
      <div class="field"><label for="day">요일</label>
        <select id="day"><option value="weekday">평일</option><option value="sat">토요일</option><option value="sun">일요일</option></select></div>
      <div class="field"><label for="mode">경로 기준</label>
        <select id="mode"><option value="fast">빠른 환승(최소 시간)</option><option value="minTransfer">최소 환승</option></select></div>
      <div class="field" id="bufferField">
        <label for="buffer" title="목표 시각보다 최소 이만큼은 먼저 도착하도록 합니다">최소 도착 여유(분)</label>
        <input id="buffer" type="number" class="mono" value="10" min="0" max="60" step="5"
          title="목표 시각보다 최소 이만큼은 먼저 도착하도록 합니다"></div>
      <div class="field">
        <label for="window" id="windowLabel">일찍 도착해도 괜찮은 한도(분)</label>
        <input id="window" type="number" class="mono" value="45" min="10" max="150" step="5"></div>
      <div class="field"><label for="walk" id="walkLabel">집에서 역까지 도보(분)</label>
        <input id="walk" type="number" class="mono" value="8" min="0" max="60" step="1"></div>
      <div class="go">
        <button class="primary" type="submit">추천 받기</button>
        <span class="hint" id="hint"></span>
      </div>
    </form>
    <div class="favs" id="favs"></div>
    <datalist id="stations"></datalist>
  </div>
</header>
<main class="wrap">
  <section id="summary"></section>
  <section id="charts"></section>
  <section id="profile"></section>
  <section id="cars"></section>
  <section id="trains"></section>
  <footer class="sources" id="sources"></footer>
</main>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
